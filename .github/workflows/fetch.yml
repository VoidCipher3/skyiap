name: Fetch prices
on:
  workflow_dispatch:

concurrency:
  group: skyiap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install requests

      - name: Fetch & build
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 20
          command: "python main.py"
        env:
          LIFECYCLE: ${{ secrets.LIFECYCLE }}
          SCRIPT_FETCH: ${{ secrets.SCRIPT_FETCH }}
      - name: Deploy Worker (site + API)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --staged --quiet; then
            echo "沒有變化，不 commit"
          else
            git commit -m "chore: update store prices ($(TZ='Asia/Taipei'date -u '+%Y-%m-%d %H:%M'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
