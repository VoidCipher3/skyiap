<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Store Pricing / 光遇商城定價對照</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#101827; color:#e5e7eb; font-family:system-ui,-apple-system,"PingFang TC",sans-serif; }
  .box { text-align:center; padding:24px; }
  p { color:#93a4b8; font-size:14px; }
  a { display:inline-block; margin:6px; padding:11px 18px; border-radius:10px; background:#93c5fd;
      color:#0f172a; font-weight:700; text-decoration:none; }
</style>
<script>
  (function () {
    var l = (navigator.language || "en").toLowerCase();
    var target = "en/";
    if (l.startsWith("zh-hant") || l === "zh-tw" || l === "zh-hk" || l === "zh-mo") target = "tw/";
    else if (l.startsWith("zh")) target = "cn/";
    else if (l.startsWith("ja")) target = "ja/";
    else if (l.startsWith("ko")) target = "ko/";
    location.replace(target);
  })();
</script>
</head>
<body>
  <div class="box">
    <p>Redirecting… / 正在跳轉…</p>
    <a href="tw/">繁體中文</a><a href="cn/">简体中文</a><a href="en/">English</a><a href="ja/">日本語</a><a href="ko/">한국어</a>
  </div>
</body>
</html>
